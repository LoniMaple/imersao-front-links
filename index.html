<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Quem está assistindo?</h1>
        <div class="profiles">
            <button class="profile">
                <img src="/assets/Maple.jpeg" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png'" alt="Perfil 1">
                <p>Maple</p>
            </button>
            <button class="profile">
                <img src="/assets/Nyx.jpeg" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png'" alt="Perfil 2">
                <p>Nyx</p>
            </button>
            <button class="profile">
                <span>+</span>
                <p>Adicionar perfil</p>
            </button>
        </div>
    </main>
</body>
</html>
